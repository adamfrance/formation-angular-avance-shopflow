name: CI

on:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx affected -t lint build --base=origin/${{ github.base_ref }}
      - run: npx nx affected -t test --base=origin/${{ github.base_ref }} --browsers=ChromeHeadless
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
